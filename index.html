<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Portal de Assinaturas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  body { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    background: #F4F6F8; /* Branco gelo */
    font-family: 'Inter', sans-serif; 
    margin: 0; 
  }
  
  .menu-container { 
    display: flex; 
    flex-direction: column; 
    gap: 16px; 
    width: 100%; 
    max-width: 320px; 
  }
  
  .btn-menu { 
    display: flex; 
    align-items: center; 
    padding: 18px 24px; 
    border-radius: 8px; 
    text-decoration: none; 
    font-weight: 600; 
    font-size: 16px; 
    transition: all 0.2s ease-in-out; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }

  .btn-menu { 
    display: flex; 
    align-items: center; 
    justify-content: flex-start; /* Trava tudo à esquerda */
    gap: 18px; /* Espaçamento rigoroso entre logo e texto */
    padding: 16px 20px; 
    border-radius: 8px; 
    text-decoration: none; 
    font-weight: 600; 
    font-size: 15px; 
    transition: all 0.2s ease-in-out; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    text-align: left;
    line-height: 1.4;
  }

  /* Centraliza a parametrização das imagens e impede achatamento */
  .btn-menu img {
    width: 65px;
    height: auto;
    flex-shrink: 0; 
  }

  /* Estrutura de Gradientes Prontos */
  .btn-CSSC { 
    background: linear-gradient(135deg, #1A3058 0%, #2C5195 100%);
    color: #F7CF3B;
    border: 1px solid #15173B; /* Detalhe em laranja */
  }
  .btn-CSSC div {
    filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.5));
  }
  .btn-menu div {
    filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.5));
  }
  .btn-CSSC:hover { filter: brightness(1.2); }

  .btn-CVS { 
    background: linear-gradient(135deg, #742B26 0%, #A93235 100%); 
    color: #FFFFFF; 
    border: 1px solid #742B26;
  }
  .btn-CVS:hover { filter: brightness(1.2); }

  .btn-branco { 
    background: linear-gradient(135deg, #007BBB 0%, #8ABDDE 100%); 
    color: #111111; 
    border: 1px solid #000000; 
  }
  .btn-branco:hover { filter: brightness(1.1); }
  }
</style>
</head>
<body>

  <div class="menu-container">
    <!-- Link para o primeiro gerador -->
    <a href="Cartao_Saude.html" class="btn-menu btn-CSSC">
    <img src="logos/CS_Logo_Principal.png" alt="Logo Principal" style="filter: drop-shadow(1px 1px 2px #000);">
      <div>Assinatura <br> Cartão Saúde Santa Casa</div>
    </a>

    <!-- Link para o segundo gerador -->
    <a href="Vida_Saude.html" class="btn-menu btn-CVS">
      <img src="logos/V_Vida_Saude.png" alt="Logo Principal">
      <div>Assinatura <br> Clínica Vida Saúde</div>
    </a>

    <a href="Santa_Casa.html" class="btn-menu btn-branco">
      <img src="logos/SC_Logo_Principal.png" alt="Logo Principal">
      <div>Assinatura <br> Santa Casa Montes Claros</div>
    </a>
  </div>

</body>
</html>
